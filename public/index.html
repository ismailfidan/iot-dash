<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1636" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TEKFİKİR IOT" />
  <title>TEKFIKIR - IOT</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg" />
  <link rel="shortcut icon" type="image/svg+xml" href="/img/favicon.svg" />
  <link rel="apple-touch-icon" href="/img/icon-192.png" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>
  <!-- Güvenli Giriş Ekranı -->
  <section id="auth-overlay" class="auth-overlay hidden" aria-label="Giriş Ekranı">
    <div class="auth-card glass-panel">
      <div class="auth-logo">
        <span class="auth-logo-icon" id="auth-logo-icon"></span>
        <div>
          <h1>TEKFIKIR - IOT</h1>
          <p>AKILLI YAŞAM ALANLARI</p>
        </div>
      </div>

      <form id="login-form" class="auth-form" autocomplete="off">
        <div class="form-group">
          <label for="username">Kullanıcı Adı</label>
          <input id="username" name="username" type="text" placeholder="admin" required autocomplete="username" />
        </div>
        <div class="form-group">
          <label for="password">Güvenlik Şifresi</label>
          <input id="password" name="password" type="password" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <div id="auth-error" class="auth-error hidden" role="alert"></div>
        <button type="submit" class="btn-primary" id="login-submit">
          <span>Güvenli Bağlantı Kur</span>
        </button>
      </form>

      <div class="auth-footer">
        <span class="security-badge">HttpOnly Oturum • HMAC-SHA256 • Rate-Limited</span>
      </div>
    </div>
  </section>

  <!-- Ana Dashboard Kabuğu -->
  <div id="app-shell" class="app-shell hidden">
    <!-- Tek Birleşik Kiosk Üst Çubuğu (Tam Genişlik: Solda Logo, Sağda Kontrol Butonları) -->
    <header class="topbar">
      <div class="brand topbar-brand">
        <img src="/img/logo-mini.svg" alt="TEK FİKİR - IOT Logo" class="brand-logo-img" />
        <div class="brand-text">
          <span class="brand-title">TEK FİKİR - IOT</span>
          <span class="brand-sub">AKILLI YAŞAM ALANLARI</span>
        </div>
      </div>

      <div class="topbar-right">
        <button
          type="button"
          id="topbar-wifi-btn"
          class="topbar-action-btn is-wifi is-active"
          title="Bağlantı Durumu: Aktif"
          aria-label="Bağlantı Durumu"
        >
          <span id="topbar-wifi-icon"></span>
        </button>

        <button
          type="button"
          id="topbar-active-btn"
          class="topbar-action-btn is-bolt"
          title="Aktif Cihazlar"
          aria-label="Aktif Cihazlar"
        >
          <span id="topbar-bolt-icon"></span>
          <span id="topbar-active-badge" class="topbar-action-badge">4</span>
        </button>

        <button
          type="button"
          id="topbar-topology-btn"
          class="topbar-action-btn"
          title="ESP-NOW Ağı"
          aria-label="ESP-NOW Ağı"
        >
          <span id="topbar-topology-icon"></span>
        </button>

        <button
          type="button"
          id="btn-toggle-edit"
          class="topbar-action-btn"
          title="Kart Sıralamasını Düzenle"
          aria-label="Kart Sıralamasını Düzenle"
        >
          <span id="icon-toggle-edit"></span>
        </button>

        <div id="edit-actions" class="edit-actions hidden">
          <button type="button" id="btn-cancel-edit" class="btn-edit-action btn-edit-cancel" title="Vazgeç">
            <span id="icon-cancel-edit"></span>
            <span>Vazgeç</span>
          </button>
          <button type="button" id="btn-save-edit" class="btn-edit-action btn-edit-save" title="Kaydet">
            <span id="icon-save-edit"></span>
            <span>Kaydet</span>
          </button>
        </div>

        <button
          type="button"
          id="topbar-settings-btn"
          class="topbar-action-btn"
          title="Ayarlar"
          aria-label="Ayarlar"
        >
          <span id="topbar-settings-icon"></span>
        </button>

        <button
          type="button"
          id="topbar-logout-btn"
          class="topbar-action-btn is-logout"
          title="Güvenli Çıkış"
          aria-label="Oturumu Kapat"
        >
          <span id="topbar-logout-icon"></span>
        </button>
      </div>
    </header>

    <!-- Yan Menü (Header Altında Sol Sütun) -->
    <aside class="sidebar glass-panel">
      <nav class="nav-list" id="space-nav" aria-label="Yaşam Alanları">
        <!-- JS tarafından doldurulacak -->
      </nav>

      <div class="sidebar-footer">
        <button type="button" id="sidebar-toggle-btn" class="btn-ghost btn-sidebar-toggle" title="Menüyü Kapat" aria-label="Menüyü Kapat veya Sabitle">
          <span class="btn-icon" id="sidebar-toggle-icon"></span>
          <span>Menüyü Kapat</span>
        </button>
      </div>
    </aside>

    <!-- Ana İçerik Alanı (Header Altında Sağ Çalışma Yüzeyi) -->
    <main class="main-content">

      <!-- Dinamik Kiosk Kontrol Izgarası -->
      <section class="dashboard-content">
        <header class="page-heading space-header" id="page-heading">
          <div class="space-title-group">
            <div id="view-icon" class="space-icon-box"></div>
            <div>
              <h2 id="view-title">Master Cihazlar</h2>
              <p id="view-subtitle" class="space-subtitle">Ana Merkez ESP32 • Tüm Buton Stilleri</p>
            </div>
          </div>
          <div id="view-sensors" class="space-telemetry"></div>
        </header>
        <div id="dashboard-content">
          <!-- JS tarafından doldurulacak -->
        </div>
      </section>
    </main>
  </div>

  <!-- Bildirim Toast Alanı -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>

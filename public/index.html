<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1636" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TEKFİKİR IOT" />
  <title>TEKFIKIR - IOT</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg" />
  <link rel="shortcut icon" type="image/svg+xml" href="/img/favicon.svg" />
  <link rel="apple-touch-icon" href="/img/icon-192.png" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>
  <!-- Güvenli Giriş Ekranı -->
  <section id="auth-overlay" class="auth-overlay hidden" aria-label="Giriş Ekranı">
    <div class="auth-card glass-panel">
      <div class="auth-logo">
        <span class="auth-logo-icon" id="auth-logo-icon"></span>
        <div>
          <h1>TEKFIKIR - IOT</h1>
          <p>AKILLI YAŞAM ALANLARI</p>
        </div>
      </div>

      <form id="login-form" class="auth-form" autocomplete="off">
        <div class="form-group">
          <label for="username">Kullanıcı Adı</label>
          <input id="username" name="username" type="text" placeholder="admin" required autocomplete="username" />
        </div>
        <div class="form-group">
          <label for="password">Güvenlik Şifresi</label>
          <input id="password" name="password" type="password" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <div id="auth-error" class="auth-error hidden" role="alert"></div>
        <button type="submit" class="btn-primary" id="login-submit">
          <span>Güvenli Bağlantı Kur</span>
        </button>
      </form>

      <div class="auth-footer">
        <span class="security-badge">HttpOnly Oturum • HMAC-SHA256 • Rate-Limited</span>
      </div>
    </div>
  </section>

  <!-- Ana Dashboard Kabuğu -->
  <div id="app-shell" class="app-shell hidden">
    <!-- Yan Menü (Masaüstü) / Üst Navigasyon (Mobil & Tablet) -->
    <aside class="sidebar glass-panel">
      <div class="brand">
        <img src="/img/logo-mini.svg" alt="TEKFIKIR - IOT Logo" class="brand-logo-img" />
        <div class="brand-text">
          <span class="brand-title">TEKFIKIR - IOT</span>
          <span class="brand-sub">AKILLI YAŞAM ALANLARI</span>
        </div>
      </div>

      <nav class="nav-list" id="space-nav" aria-label="Yaşam Alanları">
        <!-- JS tarafından doldurulacak -->
      </nav>

      <div class="sidebar-footer">
        <div class="hub-status-card" id="hub-connection-card">
          <div class="status-dot-wrap">
            <span class="status-dot sim" id="hub-status-dot"></span>
          </div>
          <div class="hub-status-info">
            <span class="hub-status-title" id="hub-status-title">Tasarım & Simülasyon</span>
            <span class="hub-status-sub" id="hub-status-sub">ESP32 Ana Merkez Bekleniyor</span>
          </div>
        </div>

        <button type="button" id="sidebar-toggle-btn" class="btn-ghost btn-sidebar-toggle" title="Menüyü Kapat" aria-label="Menüyü Kapat veya Sabitle">
          <span class="btn-icon" id="sidebar-toggle-icon"></span>
          <span>Menüyü Kapat</span>
        </button>

        <button type="button" id="logout-btn" class="btn-ghost" title="Güvenli Çıkış">
          <span class="btn-icon" id="logout-icon"></span>
          <span>Oturumu Kapat</span>
        </button>
      </div>
    </aside>

    <!-- Ana İçerik Alanı (Kiosk Çalışma Yüzeyi) -->
    <main class="main-content">
      <!-- Tek Birleşik Kiosk Durum & Senaryo Çubuğu -->
      <header class="topbar">
        <div class="topbar-left">
          <div id="view-sensors" class="topbar-sensors"></div>
        </div>

        <div class="topbar-right">
          <div class="topbar-scenes" id="scenes-grid" aria-label="Hızlı Senaryolar"></div>

          <button type="button" id="btn-toggle-edit" class="topbar-scene-btn" title="Kart Sıralamasını Düzenle" aria-label="Kart Sıralamasını Düzenle">
            <span id="icon-toggle-edit"></span>
          </button>

          <div id="edit-actions" class="edit-actions hidden">
            <button type="button" id="btn-cancel-edit" class="btn-edit-action btn-edit-cancel" title="Vazgeç">
              <span id="icon-cancel-edit"></span>
              <span>Vazgeç</span>
            </button>
            <button type="button" id="btn-save-edit" class="btn-edit-action btn-edit-save" title="Kaydet">
              <span id="icon-save-edit"></span>
              <span>Kaydet</span>
            </button>
          </div>

          <div class="topbar-divider"></div>
          <div class="ws-pill" id="ws-status-pill" title="WebSocket Senkronizasyon Durumu">
            <span class="ws-dot" id="ws-dot"></span>
          </div>
          <div class="clock-pill" id="live-clock">--:--</div>
        </div>
      </header>

      <!-- Dinamik Kiosk Kontrol Izgarası -->
      <section class="dashboard-content">
        <div class="page-heading">
          <h2 id="view-title">Master Cihazlar</h2>
        </div>
        <div id="dashboard-content">
          <!-- JS tarafından doldurulacak -->
        </div>
      </section>
    </main>
  </div>

  <!-- Bildirim Toast Alanı -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
